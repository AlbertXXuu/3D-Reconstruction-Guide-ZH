name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - name: Checkout maintained files
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check Python, JSON and local documentation links
        run: python -B scripts/check-project.py
      - name: Parse PowerShell scripts and tutorial commands
        shell: powershell
        run: .\scripts\check-powershell.ps1
      - name: Test configurable environment checks on CPU
        run: python -B -m unittest discover -s tests -p "test_*.py" -v
      - name: Test launcher preflight without model imports
        shell: powershell
        run: .\tests\test-start-demo.ps1
      - name: Test launcher runtime with a CPU HTTP fixture
        shell: powershell
        run: .\tests\test-launcher-runtime.ps1
      - name: Test configuration generation and backup
        shell: powershell
        run: .\tests\test-configure-workspace.ps1
