name: 安装或 Demo 问题
description: 报告可复现的安装、启动、推理或下载问题。
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: |
        请先检查模型教程与验证范围，并尽量用官方样图复现。
        上传前删除日志中的令牌、密码、私有仓库凭据、个人路径和敏感图片；不要上传完整环境、权重或数据集。
  - type: dropdown
    id: model
    attributes:
      label: 受影响模型
      options:
        - DUSt3R
        - MASt3R
        - VGGT
        - 通用安装或启动器
        - 其他（请在下文说明）
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: 工程版本
      description: 填写 git rev-parse HEAD 的结果，或使用的发布版本；说明相关子模块是否有本地修改。
      placeholder: "工程 commit：……；子模块：固定版本 / 有修改"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 系统与环境
      description: 请提供操作系统及版本、PowerShell 或 shell 版本、GPU 与显存、NVIDIA 驱动、Python、Torch / CUDA、Gradio 版本和环境创建方式。
      placeholder: |
        OS / shell：
        GPU / 显存 / NVIDIA 驱动：
        Python / Torch / Torch CUDA / Gradio：
        环境创建方式与名称：
        python -m pip check 结果：
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤与输入
      description: 按顺序贴出执行命令、点击操作、输入样图与参数。私人照片请改用可公开的最小样例；说明官方样图是否也能复现。
      placeholder: |
        1. 按哪个教程、哪一步安装或启动：
        2. 执行命令 / 页面操作：
        3. 输入样图、数量、分辨率与推理参数：
        4. 预期结果：
        5. 实际结果：
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 错误与检查日志
      description: 贴出完整 traceback 及其前后相关内容；可附 doctor.py 检查摘要和 outputs/runtime 中相应模型日志。未运行的检查请直接说明。
      render: text
    validations:
      required: true
  - type: textarea
    id: attempts
    attributes:
      label: 已尝试的操作
      description: 写出已经做过的操作及结果，尤其是依赖升级、环境重建或源码修改。没有则填写“未尝试其他修改”。
    validations:
      required: false
